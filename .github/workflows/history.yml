name: Completar histórico Garmin
on:
  workflow_dispatch:
  schedule:
    - cron: '43 * * * *'
permissions:
  contents: read
  actions: write
concurrency:
  group: garmin-private-sync
  cancel-in-progress: false
jobs:
  history:
    if: github.event_name == 'workflow_dispatch' || vars.GARMIN_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run sync:garmin
        id: sync
        env:
          GARMIN_PERSONAL_API_KEY: ${{ secrets.GARMIN_PERSONAL_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
          HISTORY_BACKFILL: 'true'
          MAX_ACTIVITIES: '100'
      - name: Continuar el siguiente lote pendiente
        if: always() && steps.sync.outputs.continue_history == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'history.yml',
              ref: 'main'
            });
